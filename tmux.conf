set -g default-terminal "tmux-256color"
set -g history-limit 100000
set -g base-index 1
setw -g pane-base-index 1
set -g focus-events on

# use VI
set-window-option -g mode-keys vi

# Use ctrl-e instead of ctrl-b
set -g prefix C-e
unbind C-b
bind C-e send-prefix

unbind C-f
bind C-f command-prompt "switch-client -t %%"

# kill
unbind k
bind k confirm-before "kill-window"

unbind ^x
bind ^x kill-pane

# reload config
unbind r
bind r source-file ~/.tmux.conf

unbind ^W
bind ^W split-window -l 25% -c '#{pane_current_path}' '/usr/bin/env vim .' \; swap-pane -D
unbind ^T
bind ^T split-window -l 25% -c '#{pane_current_path}'

# tile all windows
unbind =
bind = select-layout tiled

# status bar
set -g status-bg black
set -g status-fg white
set -g status-interval 1

set -g status-left ' '
set -g status-right '#[fg=yellow]%Y-%m-%d %H:%M#[default] '

set-window-option -g window-status-current-style fg=yellow,bg=black

set -g mouse on

set -sg escape-time 0

# Pane navigation (option key as meta)
bind -n M-h select-pane -L
bind -n M-j select-pane -D
bind -n M-k select-pane -U
bind -n M-l select-pane -R

# Splits
bind -n M-\\ split-window -h
bind -n M-- split-window -v

# Resize panes
bind-key -nr    M-Up resize-pane -U
bind-key -nr  M-Down resize-pane -D
bind-key -nr  M-Left resize-pane -L
bind-key -nr M-Right resize-pane -R

# Copy mode
bind-key -n M-PPage copy-mode -u
bind-key -n M-u copy-mode
bind-key -n M-i paste-buffer
bind -T copy-mode-vi WheelUpPane   send-keys -X halfpage-up
bind -T copy-mode-vi WheelDownPane send-keys -X halfpage-down

bind-key -n M-d detach-client

bind-key -n M-8 choose-session
bind-key -n M-9 switch-client -p
bind-key -n M-0 switch-client -n

# Tab titles
setw -g monitor-activity on
set -g visual-activity on

set -g set-titles on
set -g set-titles-string '#S: #W'
setw -g automatic-rename

# Cycle through panes by pressing ctrl+E twice
unbind ^E
bind ^E select-pane -t :.+

# start new tab or pane in current directory
bind '"' split-window -c '#{pane_current_path}'
bind % split-window -h -c '#{pane_current_path}'
bind c new-window -c '#{pane_current_path}'
